<div class="contact-wrapper">
  
  <header class="contact-hero">
    <h1>CONTATTI</h1>
    <p class="subtitle">Hai un progetto in mente o vuoi semplicemente fare due chiacchiere? Scrivimi.</p>
  </header>

  <div class="contact-grid">
    
    <div class="contact-info">
      <h2>CANALI DIRETTI</h2>
      <div class="channels-list">
        
        <div class="channel-item">
          <span class="label">EMAIL</span>
          <a href="mailto:pesqq.mico@gmail.com" class="channel-link">pesqq.mico@gmail.com</a>
        </div>
        
        <div class="channel-item">
          <span class="label">LINKEDIN</span>
          <a href="https://linkedin.com" target="_blank" class="channel-link">linkedin.com</a>
        </div>
        
        <div class="channel-item">
          <span class="label">GITHUB</span>
          <a href="https://github.com" target="_blank" class="channel-link">github.com</a>
        </div>
        
      </div>
    </div>

    <div class="contact-form-container">
      <h2>INVIA UN MESSAGGIO</h2>
      
      <form (submit)="sendForm($event)" class="pure-form">
        
        <div class="form-group">
          <label for="name">NOME</label>
          <input type="text" id="name" name="name" [(ngModel)]="formData.name" placeholder="Il tuo nome" required />
        </div>
        
        <div class="form-group">
          <label for="email">EMAIL</label>
          <input type="email" id="email" name="email" [(ngModel)]="formData.email" placeholder="la-tua@email.com" required />
        </div>
        
        <div class="form-group">
          <label for="message">MESSAGGIO</label>
          <textarea id="message" name="message" [(ngModel)]="formData.message" rows="5" placeholder="Di cosa vuoi parlare?" required></textarea>
        </div>

        <button type="submit" class="submit-btn">INVIA MESSAGGIO</button>
      </form>
    </div>

  </div>
</div>
