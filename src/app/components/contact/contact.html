<div class="contact-wrapper">
  
  <header class="contact-hero">
    <h1>CONTATTI</h1>
    <p class="subtitle">Hai un progetto in mente o vuoi semplicemente fare due chiacchiere? Scrivimi.</p>
  </header>

  <div class="contact-grid">
    
    <div class="contact-info">
      <h2>CANALI DIRETTI</h2>
      <div class="channels-list">
        
        <div class="channel-item">
          <span class="label">EMAIL</span>
          <a href="mailto:pesqq.mico@gmail.com" class="channel-link">pesqq.mico@gmail.com</a>
        </div>
        
        <div class="channel-item">
          <span class="label">LINKEDIN</span>
          <a href="https://linkedin.com" target="_blank" class="channel-link">linkedin.com</a>
        </div>
        
        <div class="channel-item">
          <span class="label">GITHUB</span>
          <a href="https://github.com/ItsMIko04" target="_blank" rel="noopener noreferrer" class="channel-link">github.com/ItsMIko04</a>
        </div>
        
      </div>
    </div>

    <div class="contact-form-container">
      <h2>INVIA UN MESSAGGIO</h2>
      
      <div class="pure-form">
        
        <div class="form-group">
          <label for="message">IL TUO MESSAGGIO</label>
          <textarea 
            id="message" 
            (input)="onMessageChange($event)" 
            rows="6" 
            placeholder="Scrivi qui il tuo messaggio e poi clicca sotto per inviare..." 
            required>
          </textarea>
        </div>

        <a [href]="generateMailtoLink()" class="submit-btn">
          APRI LA TUA APP DI POSTA
        </a>
        
      </div>
    </div>

  </div>
</div>
